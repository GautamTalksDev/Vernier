# vernier align scoring matrix — costs-v1
#
# Needleman–Wunsch is run as a SCORE MAXIMIZATION (higher is better).
# Reviewers: change scores here, not in Python. Bump to costs-v2.toml for
# incompatible retunes and keep this file immutable once shipped.
#
# Tie-break is NOT in this file; it is fixed in code (see align/needleman.py):
# when predecessor scores are equal, prefer diagonal, then up/delete, then
# left/insert — i.e. consume the lower source (A) index as soon as an equal
# score allows.

version = "costs-v1"

[meta]
description = "Global alignment scores for Vernier trajectory events"
max_events = 5000

# Linear gap penalty applied for Inserted (B-only) or Deleted (A-only).
# Rationale: keep gaps cheaper than cross-kind substitutions so unrelated
# timelines become mostly Inserted/Deleted (not a sausage of Substituted).
# Also cheap enough that reordered same-name ToolCalls prefer
# Del+Match+Ins over two name-mismatch diagonals.
[gap]
score = -1

# Scores when aligning two events on the diagonal.
[match]
# Same kind, non-tool: semantic step correspondence.
LlmTurn = 3
ToolResult = 3
Terminal = 4
# ToolCall with identical tool name: strongest like-for-like signal.
# Rationale: with gap=-1, Del+Match+Ins scores (-1)+5+(-1)=3;
# two ToolCall_diff_name diagonals score 2*(-1)=-2, so reordering
# still prefers gap+match+gap. A same-length rename prefers one
# substitution (-1) over Del+Ins (-2).
ToolCall_same_name = 5
# ToolCall with different tool names: wrong tool — Substituted.
ToolCall_diff_name = -1

# Scores when kinds differ (diagonal substitution).
# Rationale: must be strictly worse than paying two gaps (-2) so the
# aligner prefers indel over inventing a correspondence.
[mismatch]
default = -5

# Optional overrides for specific kind pairs (A_kind|B_kind, sorted form
# is NOT used — keys are "LeftKind__RightKind" with the A kind first so
# the matrix is explicit and order-independent of dict hashing: the loader
# reads keys as written and looks up (a.kind, b.kind) exactly.
[mismatch.pairs]
# Terminal should rarely substitute for anything else.
LlmTurn__Terminal = -5
ToolCall__Terminal = -5
ToolResult__Terminal = -5
Terminal__LlmTurn = -5
Terminal__ToolCall = -5
Terminal__ToolResult = -5
