name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest with coverage
        run: >
          uv run pytest -x
          --cov=vernier
          --cov-report=term-missing

      - name: Canonical coverage gate (>=95%)
        run: >
          uv run coverage report
          --include=src/vernier/canonical/*
          --fail-under=95

      - name: Alignment golden bytes (cross-OS identity)
        run: >
          uv run pytest -x
          tests/test_align.py
          -k "fixture_alignment_matches_golden_bytes or repeated_runs_byte_identical"

      - name: Divergence fixtures (cross-OS identity)
        run: >
          uv run pytest -x
          tests/test_classify.py
          -k "fixture_severity_and_rule_ids or d04_near_miss or d07_parallel_near_miss"

      - name: Verify fixtures (KT-3 full-stub re-drive)
        run: >
          uv run pytest -x
          tests/test_verify.py
          -k "verify_fixture_severity_none or hand_edited or replay_miss"

  import-minimal:
    name: Import with runtime deps only
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync runtime dependencies only
        run: uv sync --locked --no-dev

      - name: Import package with zero optional dependencies
        run: >
          uv run python -c
          "import vernier; import vernier.cli.main; print(vernier.__version__)"
