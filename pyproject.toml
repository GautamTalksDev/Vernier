[project]
name = "vernier"
version = "0.0.1a1"
description = "Deterministic capture, replay, and divergence classification for agent runs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Vernier Contributors" }]
dependencies = [
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "typer>=0.12",
]

[project.scripts]
vern = "vernier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-requests>=2.33.0.20260712",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vernier", "src/vern"]

[tool.hatch.build.targets.wheel.force-include]
"src/vernier/align/costs-v1.toml" = "vernier/align/costs-v1.toml"
"src/vernier/classify/ignore-v1.toml" = "vernier/classify/ignore-v1.toml"

[tool.hatch.build.targets.sdist.force-include]
"src/vernier/align/costs-v1.toml" = "src/vernier/align/costs-v1.toml"
"src/vernier/classify/ignore-v1.toml" = "src/vernier/classify/ignore-v1.toml"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
packages = ["vernier", "vern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["vernier"]

[tool.coverage.report]
show_missing = true
skip_empty = true
