[project]
name = "vernier"
version = "0.1.0"
description = "Deterministic capture, replay, and divergence classification for agent runs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Vernier Contributors" }]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
vern = "vernier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vernier"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
packages = ["vernier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
