[project]
name = "vernier-cli"
version = "0.0.1a1"
description = "Deterministic capture, replay, and divergence classification for agent runs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Vernier Contributors" }]
keywords = ["agents", "determinism", "replay", "divergence", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/GautamTalksDev/Vernier"
Repository = "https://github.com/GautamTalksDev/Vernier"
Issues = "https://github.com/GautamTalksDev/Vernier/issues"
Documentation = "https://github.com/GautamTalksDev/Vernier/blob/main/docs/CI.md"

[project.scripts]
vern = "vernier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "types-requests==2.33.0.20260712",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vernier"]

[tool.hatch.build.targets.wheel.force-include]
"src/vernier/align/costs-v1.toml" = "vernier/align/costs-v1.toml"
"src/vernier/classify/ignore-v1.toml" = "vernier/classify/ignore-v1.toml"

[tool.hatch.build.targets.sdist]
# Source distribution is publishable source only (no fixtures, scripts, study junk).
only-include = [
    "src",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# python_version pins CI's lowest matrix entry so `uv run mypy src` matches CI on any host.
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
packages = ["vernier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["vernier"]

[tool.coverage.report]
show_missing = true
skip_empty = true
